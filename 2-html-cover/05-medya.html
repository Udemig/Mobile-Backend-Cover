<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=,, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Medya</h1>

    <!-- src -->
    <h2>Görsel</h2>
    <img
      src="https://eu-central-1-jde.graphassets.com/AiQ00hd1mTUe8afHSH6YFz/resize=width:913/quality=value:75/output=format:webp/gK2mYXNoQhmSOd8aLR9w"
      alt="latte çeşitleri"
      width="300"
      height="300"
      loading="lazy"
    />

    <!-- alt özelliği -->
    <img src="yok.jpg" alt="bu gösel bulanamadı" />

    <!-- figure -->
    <figure>
      <img
        src="https://kahhve.com/blog/wp-content/uploads/2025/10/What_is_a_latte-1024x569.jpeg"
        alt="sabak kahvesi"
        width="300"
        height="200"
      />
      <figcaption>Şekil 1: Sabah Kahvesi</figcaption>
    </figure>

    <!-- video -->
    <h2>Video</h2>
    <video
      width="400"
      controls
      muted
      poster="https://kahhve.com/blog/wp-content/uploads/2025/10/What_is_a_latte-1024x569.jpeg"
    >
      <source src="kaynaklar/video.mp4" />
    </video>

    <!-- ses -->
    <h2>Ses</h2>
    <audio src="kaynaklar/ses.mp3" controls loop></audio>

    <!-- iframe -->
    <iframe
      width="460"
      height="315"
      src="https://www.youtube.com/embed/UfNu7pcR0e8?si=lfSw0YZ0uQzdyJUP"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>

    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d13344.03950994899!2d32.84624380154201!3d39.938381432521254!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14d34e6038317ba5%3A0xa324174007072428!2sAtaturk%20Statue!5e0!3m2!1sen!2str!4v1792935650579!5m2!1sen!2str"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </body>
</html>
