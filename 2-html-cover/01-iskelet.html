<!doctype html>
<html lang="en">
  <link>
    <!-- head: ekranda görünmez, tarayıcıya bilgi verir -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01 - İskelet</title>
    <meta name="description" content="Bu bir html iskeletidir">
    <meta name="author" content="Furkan Evin">
    <link rel="icon" href="./logo.webp">
  </head>
  <body>
    <!-- body: ekranda görünen her şey -->
    <h1>Merhaba HTML</h1>

    <!-- etiket anatomisi: açılış + içerik + kapanış -->
    <p class="giris">Bu bir paragraf</p>

    <!-- boş etiketler -->
    <br>
    <hr>

    <!-- iç içe yazım -->
     <p>Bu <strong>önemli</strong> bir nokta</p>
  </body>
</html>
