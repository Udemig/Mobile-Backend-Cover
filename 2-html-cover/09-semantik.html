<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <a href="">
        <img src="/logo.webp" alt="logo" width="60" height="60" />
      </a>

      <nav>
        <ul>
          <li><a href="#">Anasayfa</a></li>
          <li><a href="#">Menü</a></li>
          <li><a href="#">İletişim</a></li>
        </ul>
      </nav>

      <button type="button" aria-label="menüyü aç">|||</button>
    </header>

    <main>
      <!-- Tek h1 -->
      <h1>Kahve Etiketleri</h1>

      <section>
        <h2>Sıcak Kahveler</h2>

        <article>
          <header>
            <h3>Latte</h3>
            <p>Yayın: <time datetime="2026-10-25">25 Ekim 2026</time></p>
          </header>
          <figure>
            <img
              src="https://kahhve.com/blog/wp-content/uploads/2025/10/What_is_a_latte-1024x569.jpeg"
              alt="kahve"
              width="200"
            />
            <figcaption>Klasik Latte</figcaption>
            <p>Espresso ve sıcak süt</p>
            <footer>Tarifin tamamını oku: Latte</footer>
          </figure>
        </article>
      </section>
    </main>

    <aside>
      <h2>Bunlar da ilginizi çekebilir</h2>
    </aside>

    <footer>&copy; Tüm hakları saklıdır</footer>

    <!-- dialog açılır kapanır -->
    <dialog open>
      <p>Sitemize hoş geldiniz!</p>
      <form method="dialog"><button>Kapat</button></form>
    </dialog>

    <progress value="70" max="100"></progress>
    <meter value="0.8"></meter>
  </body>
</html>
