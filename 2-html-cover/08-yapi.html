<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Block ve Inline</h1>

    <!-- Block - alt alta -->
    <div style="background: lightsalmon">div1</div>
    <div style="background: lightblue">div2</div>
    <p style="background: lightgreen">paragraf</p>

    <hr />

    <!-- inline- yan yana -->
    <span style="background: lightsalmon">span1</span>
    <span style="background: lightblue">span2</span>
    <a style="background: lightgreen">link</a>
    <strong style="background: lightsalmon">strong</strong>

    <!-- global özellik -->
    <h2 title="esktra açıklama">Başlık</h2>

    <p hidden>yazı içerği</p>

    <p lang="en">Hello, this part is englihs</p>

    <div tabindex="0">tab tuluna bas</div>
  </body>
</html>
