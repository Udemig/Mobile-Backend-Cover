<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Renk ve Arka Plan</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1 class="baslik">Renk ve arka plan</h1>

    <div class="renkler">
      <div class="r isim">tomato</div>
      <div class="r hex">#38bdf8</div>
      <div class="r rgb">rgb(34, 197, 94)</div>
      <div class="r hsl">hsl(280, 70%, 55%)</div>
    </div>

    <div class="bant">linear-gradient</div>

    <div class="foto">
      <div class="perde">Yarı saydam perde: rgba(0, 0, 0, 0.5)</div>
    </div>

    <p class="soluk">opacity: 0.4 ile soluk yazı</p>
  </body>
</html>
